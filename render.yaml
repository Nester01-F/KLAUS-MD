services:
  # ─── WhatsApp Bot (worker — no HTTP port needed) ───
  - type: worker
    name: klaus-md
    runtime: node
    plan: starter          # use 'free' only for testing
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_MODE
        value: bot
      - key: MODE
        value: public
      - key: PREFIX
        value: .
      - key: BOT_NAME
        value: KLAUS MD
      - key: OWNER_NAME
        value: Warrior Felix
      - key: DEVELOPER_NAME
        value: Warrior Felix
      # Secrets — set these in the Render dashboard
      - key: SESSION
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: DEVELOPER_NUMBER
        sync: false

  # ─── Session Pairing Server  (web — serves pairing page) ───
  - type: web
    name: klaus-md-session
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node session/session-server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_NAME
        value: KLAUS MD
      # Required: protects /generate and /export on a public URL
      - key: SESSION_ADMIN_TOKEN
        sync: false
